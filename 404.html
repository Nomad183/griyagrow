<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Redirect all routes to index.html with path preserved
    var path = window.location.pathname;
    window.location.href = '/griyagrow/' + (path.startsWith('/griyagrow/') ? '' : path.slice(1)) + window.location.search + window.location.hash;
  </script>
</head>
<body>Redirecting...</body>
</html>
